addEventListener('mousemove',e=>{if(!document.pointerLockElement)return;pl.yaw-=e.movementX*.0022;pl.pitch=Math.max(-1.55,Math.min(1.55,pl.pitch-e.movementY*.0022))});
addEventListener('keydown',e=>{keys[e.code]=true;
if(e.code=='KeyE'){if(invOpen){invOpen=false;inv.style.display='none';R.domElement.requestPointerLock()}else if(document.pointerLockElement){invOpen=true;inv.style.display='flex';document.exitPointerLock()}}
if(e.code>='Digit1'&&e.code<='Digit9'){cur=+e.code[5]-1;upd()}});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('wheel',e=>{cur=(cur+(e.deltaY>0?1:8))%9;upd()});
addEventListener('contextmenu',e=>e.preventDefault());
const hits=(px,py,pz)=>{for(const x of[px-.3,px+.3])for(const y of[py,py+.9,py+1.79])for(const z of[pz-.3,pz+.3])if(solid(x,y,z))return true;return false};
function ray(){const d=new THREE.Vector3();cam.getWorldDirection(d);const o=cam.position;let p=null;
for(let t=0;t<6;t+=.03){const x=Math.floor(o.x+d.x*t),y=Math.floor(o.y+d.y*t),z=Math.floor(o.z+d.z*t);if(get(x,y,z))return{x,y,z,p};
if(!p||p[0]!=x||p[1]!=y||p[2]!=z)p=[x,y,z]}return null}
// zombiler
const mobs=[];
function spawn(){let x,z;do{x=4+Math.random()*(W-8);z=4+Math.random()*(W-8)}while(Math.hypot(x-pl.x,z-pl.z)<25||V.some(v=>Math.hypot(v[0]-x,v[1]-z)<12));
const g=new THREE.Group(),mk=(w,h,d,c,x,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.userData.c=c;m.position.set(x,y,0);g.add(m)};
mk(.5,.75,.25,0x1fa3a3,0,1.1);mk(.5,.5,.5,0x4a8a3a,0,1.72);mk(.22,.75,.22,0x3a3a9a,-.13,.38);mk(.22,.75,.22,0x3a3a9a,.13,.38);
const ar=x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.2,.2,.7),new THREE.MeshBasicMaterial({color:0x4a8a3a}));m.userData.c=0x4a8a3a;m.position.set(x,1.4,.35);g.add(m)};ar(-.36);ar(.36);
const ey=x=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.1,.08,.02),new THREE.MeshBasicMaterial({color:0x111111}));m.userData.c=0x111111;m.position.set(x,1.76,.26);g.add(m)};ey(-.12);ey(.12);
scene.add(g);mobs.push({g,x,z,y:topY(x,z),hp:10,t:0,a:0,kx:0,kz:0,fl:0})}
for(let i=0;i<22;i++)spawn();
function flash(m,on){m.g.children.forEach(c=>c.material.color.setHex(on?0xff3030:c.userData.c))}
function hitMob(dmg){const d=new THREE.Vector3();cam.getWorldDirection(d);for(const m of mobs){const v=new THREE.Vector3(m.x,m.y+1,m.z).sub(cam.position),t=v.dot(d);
if(t>0&&t<3.6&&v.clone().addScaledVector(d,-t).length()<.8){m.hp-=dmg;m.fl=.2;flash(m,1);m.kx=d.x*7;m.kz=d.z*7;
if(m.hp<=0){pl.food=Math.min(20,pl.food+4);scene.remove(m.g);mobs.splice(mobs.indexOf(m),1);spawn()}return true}}return false}
addEventListener('mousedown',e=>{if(!document.pointerLockElement)return;const held=hot[cur];
if(e.button==0){sw0=.3;
if(hitMob(held==101?8:held==100?5:1)||held>=100)return;const r=ray();if(r)put(r.x,r.y,r.z,0)}
else if(e.button==2){if(held==103||held==104){if(pl.food<20){pl.food=Math.min(20,pl.food+(held==103?4:8));sw0=.3;hearts()}return}if(pl.ar[held]!=null){pl.ar[held]=pl.ar[held]?0:1;hearts();msg(pl.ar[held]?'Zırh takıldı':'Zırh çıkarıldı');return}const vv=aim(vil);if(vv){talk();return}const r0=ray();if(r0){const tg=get(r0.x,r0.y,r0.z);if(tg>=22&&tg<=25){const py=(tg&1)?r0.y-1:r0.y+1,pt=get(r0.x,py,r0.z),o=tg>=24?-2:2;put(r0.x,r0.y,r0.z,tg+o);if(pt>=22)put(r0.x,py,r0.z,pt+o);sw0=.3;return}}if(held>=100&&held!=106)return;const r=r0;if(!r||!r.p)return;const[x,y,z]=r.p;
if(!(Math.abs(pl.x-(x+.5))<.8&&Math.abs(pl.z-(z+.5))<.8&&y+1>pl.y&&y<pl.y+1.8)){if(held==106){if(!get(x,y+1,z)){put(x,y,z,22);put(x,y+1,z,23)}}else put(x,y,z,held)}}});
// çok oyunculu
const nick='Oyuncu'+(100+Math.random()*900|0);let room=null;const rp={};
const put=(x,y,z,t)=>{setB(x,y,z,t);if(room)room.emit('blk',{x,y,z,t})};
function remote(col,n){const g=new THREE.Group(),bx=(w,h,d,c,x,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,0);g.add(m)};
bx(.5,.75,.25,col,0,1.1);bx(.5,.5,.5,0xe0b090,0,1.72);bx(.2,.7,.2,col,-.36,1.15);bx(.2,.7,.2,col,.36,1.15);bx(.22,.75,.22,0x333366,-.13,.38);bx(.22,.75,.22,0x333366,.13,.38);
const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='#0008';x.fillRect(0,0,256,64);x.fillStyle='#fff';x.font='32px sans-serif';x.textAlign='center';x.fillText(n,128,44);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(1.6,.4,1);s.position.y=2.5;g.add(s);scene.add(g);return g}
(async()=>{try{room=window.claude?await claude.use('room'):null}catch(e){room=null}if(!room){const u=new URLSearchParams(location.search).get('ws');if(u)wsInit(u);return}
room.on('blk',m=>{const d=m.data;if(m.isMe||!d||typeof d.t!='number'||d.t<0||d.t>25)return;setB(d.x|0,d.y|0,d.z|0,d.t|0)});
room.onPeers(ch=>{net.textContent='🌐 '+ch.peers.length+' oyuncu çevrimiçi';
ch.peers.forEach(p=>{if(p.isMe)return;const d=p.presence;if(typeof d.x!='number')return;let r=rp[p.peer];
if(!r){r=rp[p.peer]={g:remote([0xe74c3c,0x2ecc71,0xf1c40f,0x9b59b6][Object.keys(rp).length%4],String(d.n||'Oyuncu').slice(0,16)),p:new THREE.Vector3(d.x,d.y,d.z),yaw:0};r.g.position.copy(r.p)}
r.p.set(d.x,d.y,d.z);r.yaw=(+d.yaw||0)+Math.PI});
ch.left.forEach(p=>{const r=rp[p.peer];if(r){scene.remove(r.g);delete rp[p.peer]}})},()=>{})})();
const vil=[];
function vspawn(x,z){const g=new THREE.Group(),bx=(w,h,d,c,px,py,pz)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(px,py,pz);g.add(m)};
bx(.55,1.4,.35,0x7b5a3a,0,.7,0);bx(.5,.5,.5,0xd8a58a,0,1.65,0);bx(.14,.24,.14,0xb87c62,0,1.6,.3);bx(.6,.2,.3,0x5e432a,0,1.15,.2);bx(.52,.06,.52,0x3a2a18,0,1.92,0);
scene.add(g);vil.push({g,x,z,y:topY(x,z),t:0,a:-1,hx:x,hz:z})}
V.forEach(v=>[[3.5,3.5],[-3.5,3.5],[3.5,-3.5]].forEach(o=>vspawn(v[0]+o[0],v[1]+o[1])));
const aim=l=>{const d=new THREE.Vector3();cam.getWorldDirection(d);for(const m of l){const v=new THREE.Vector3(m.x,m.y+1,m.z).sub(cam.position),t=v.dot(d);if(t>0&&t<3.6&&v.clone().addScaledVector(d,-t).length()<.8)return m}return null};
const TALK=['Köylü: Hoş geldin! Köyümüzü sever misin?','Köylü: Geceleri zombilere dikkat et!','Köylü: Al, bir elma ye, aç görünüyorsun.','Köylü: Elmas bulursan bana da göster!'];let tk=0;
function talk(){msg(TALK[tk++%4]);pl.food=Math.min(20,pl.food+3);hearts()}
function wsInit(u){const ws=new WebSocket(u),cols=[0xe74c3c,0x2ecc71,0xf1c40f,0x9b59b6],ab=d=>{if(d&&Number.isInteger(d.t)&&d.t>=0&&d.t<=25)setB(d.x|0,d.y|0,d.z|0,d.t)},cnt=()=>net.textContent='🌐 '+(Object.keys(rp).length+1)+' oyuncu çevrimiçi';
room={emit:(t,d)=>{if(ws.readyState==1)ws.send(JSON.stringify({t:'b',d}))},presence:d=>{if(ws.readyState==1)ws.send(JSON.stringify({t:'p',d}))}};
ws.onopen=cnt;ws.onclose=()=>{room=null;net.textContent='👤 Bağlantı koptu'};
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
if(m.t=='init'&&Array.isArray(m.edits))m.edits.forEach(ab);else if(m.t=='b')ab(m.d);
else if(m.t=='p'&&m.d&&typeof m.d.x=='number'){let r=rp[m.id];if(!r){r=rp[m.id]={g:remote(cols[Object.keys(rp).length%4],String(m.d.n||'Oyuncu').slice(0,16)),p:new THREE.Vector3(m.d.x,m.d.y,m.d.z),yaw:0};r.g.position.copy(r.p)}r.p.set(m.d.x,m.d.y,m.d.z);r.yaw=(+m.d.yaw||0)+Math.PI;cnt()}
else if(m.t=='l'&&rp[m.id]){scene.remove(rp[m.id].g);delete rp[m.id];cnt()}}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
if(!invOpen){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),l=Math.hypot(f,s)||1,sp=(keys.ShiftLeft?6.5:4.5)*dt/l;
const dx=(-Math.sin(pl.yaw)*f+Math.cos(pl.yaw)*s)*sp,dz=(-Math.cos(pl.yaw)*f-Math.sin(pl.yaw)*s)*sp;
if(!hits(pl.x+dx,pl.y,pl.z))pl.x+=dx;if(!hits(pl.x,pl.y,pl.z+dz))pl.z+=dz;
pl.vy-=25*dt;if(keys.Space&&pl.g){pl.vy=8;pl.g=false}
const ny=pl.y+pl.vy*dt;if(hits(pl.x,ny,pl.z)){if(pl.vy<0)pl.g=true;pl.vy=0}else{pl.y=ny;pl.g=false}}
if(pl.y<-10){const p=sp0();pl.x=p[0];pl.y=p[1]+1;pl.z=p[2];pl.vy=0}
pl.cd-=dt;
const mv=!invOpen&&(keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD);pl.food=Math.max(0,pl.food-dt*(mv?(keys.ShiftLeft?.12:.05):.015));pl.ft+=dt;
if(pl.ft>4){pl.ft=0;if(pl.food<=0&&pl.hp>1)pl.hp--;else if(pl.food>=16&&pl.hp<10)pl.hp++}
pl.hu=(pl.hu||0)+dt;if(pl.hu>.5){pl.hu=0;hearts()}
pl.pt=(pl.pt||0)+dt;if(room&&pl.pt>.1){pl.pt=0;room.presence({x:+pl.x.toFixed(2),y:+pl.y.toFixed(2),z:+pl.z.toFixed(2),yaw:+pl.yaw.toFixed(2),n:nick})}
for(const k in rp){const r=rp[k];r.g.position.lerp(r.p,.25);r.g.rotation.y=r.yaw}
for(const v of vil){v.t-=dt;if(v.t<0){v.t=1.5+Math.random()*3;v.a=Math.random()<.3?-1:Math.random()*6.28}if(v.a>=0){const nx=v.x+Math.cos(v.a)*.8*dt,nz2=v.z+Math.sin(v.a)*.8*dt;if(Math.abs(topY(nx,nz2)-v.y)<.5&&Math.hypot(nx-v.hx,nz2-v.hz)<12){v.x=nx;v.z=nz2;v.y=topY(v.x,v.z);v.g.rotation.y=Math.PI/2-v.a}else v.t=0}v.g.position.set(v.x,v.y,v.z)}
if(sw0>0)sw0-=dt;const kk=Math.sin(Math.PI*Math.max(0,sw0)/.3);hg.rotation.set(.1-kk*1.1,.3-kk*.3,0);hg.position.set(.36-kk*.1,-.34+(mv?Math.sin(now/130)*.015:0)-kk*.1,-.55-kk*.15);
for(const m of mobs){const dx=pl.x-m.x,dz=pl.z-m.z,d=Math.hypot(dx,dz)||1;let vx,vz;
if(d<18){vx=dx/d;vz=dz/d}else{m.t-=dt;if(m.t<0){m.t=2+Math.random()*3;m.a=Math.random()*6.28}vx=Math.cos(m.a)*.4;vz=Math.sin(m.a)*.4}
m.kx*=.88;m.kz*=.88;const nx=Math.max(1,Math.min(W-1,m.x+(vx*1.5+m.kx)*dt)),nz2=Math.max(1,Math.min(W-1,m.z+(vz*1.5+m.kz)*dt));
const nh=topY(nx,nz2);if(nh-m.y<1.2){m.x=nx;m.z=nz2}else m.a+=2;m.y=topY(m.x,m.z);
if(m.fl>0){m.fl-=dt;if(m.fl<=0)flash(m,0)}
m.g.position.set(m.x,m.y,m.z);m.g.rotation.y=Math.atan2(vx,vz);
if(d<1.1&&Math.abs(pl.y-m.y)<1.6&&pl.cd<=0){pl.cd=1;if(Math.random()>=Object.values(pl.ar).filter(Boolean).length*.2)pl.hp--;hearts();const e=document.getElementById('dmg');e.style.opacity=.35;setTimeout(()=>e.style.opacity=0,150);
if(pl.hp<=0){pl.hp=10;pl.food=20;hearts();const p=sp0();pl.x=p[0];pl.y=p[1]+1;pl.z=p[2]}}}
cam.position.set(pl.x,pl.y+1.6,pl.z);cam.rotation.set(pl.pitch,pl.yaw,0);
const r=document.pointerLockElement?ray():null;sel.visible=!!r;if(r)sel.position.set(r.x+.5,r.y+.5,r.z+.5);
R.render(scene,cam)}
requestAnimationFrame(loop);
</script></body></html>
